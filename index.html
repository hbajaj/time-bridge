<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of zone rows; each row = label | big time | 24-hour day/night strip aligned to the base zone's day */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #16202b; --muted: #5d6b7a; --line: #d5dce3;
  --accent: #1f5f8b; --accent-soft: #dceaf4;
  --day: #f4d98c; --day-ink: #4a3a10; --shoulder: #cfe0ec; --shoulder-ink: #24435c;
  --night: #2b3a55; --night-ink: #c9d4e4; --marker: #d1442f;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #161d25; --ink: #e6ecf2; --muted: #8b9aab; --line: #263240;
  --accent: #72b6e3; --accent-soft: #1c2e3e;
  --day: #b8953f; --day-ink: #1d1505; --shoulder: #33495f; --shoulder-ink: #d3e1ee;
  --night: #0a101a; --night-ink: #7f91a8; --marker: #ff7a63; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #161d25; --ink: #e6ecf2; --muted: #8b9aab; --line: #263240;
  --accent: #72b6e3; --accent-soft: #1c2e3e;
  --day: #b8953f; --day-ink: #1d1505; --shoulder: #33495f; --shoulder-ink: #d3e1ee;
  --night: #0a101a; --night-ink: #7f91a8; --marker: #ff7a63; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.02em; margin: 0; line-height: 1; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

button, input { font: inherit; color: inherit; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 7px 10px; cursor: pointer; font-family: var(--f-mono); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Scrubber */
.scrub { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.scrub-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.scrub-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.scrub-value { font-family: var(--f-mono); font-size: 14px; }
.scrub-value b { color: var(--accent); font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* Zone rows */
.zones { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(150px, 210px) 132px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.home { background: var(--accent-soft); }
.place { min-width: 0; }
.city { font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: var(--surface); }
.pill.day { background: transparent; color: var(--marker); border: 1px solid var(--marker); }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.time { font-family: var(--f-display); font-weight: 500; font-size: 30px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1; }
.time small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.date { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.delta { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }

.strip { position: relative; display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 38px; }
.cell { border: 0; padding: 0; border-radius: 3px; cursor: pointer; display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.cell.n { background: var(--night); color: var(--night-ink); }
.cell.s { background: var(--shoulder); color: var(--shoulder-ink); }
.cell.d { background: var(--day); color: var(--day-ink); }
.cell.mid { box-shadow: inset 2px 0 0 var(--marker); }
.cell .dl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
.marker { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--marker); border-radius: 1px; pointer-events: none; transform: translateX(-1px); }

.actions { display: flex; gap: 4px; }
.icon { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.icon:hover { border-color: var(--line); color: var(--ink); }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

/* Add */
.add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add input { flex: 1 1 240px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.msg.err { color: var(--marker); }

/* Copy summary */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.summary pre { margin: 0; font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.summary-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

@media (max-width: 760px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; }
  .row .clock { text-align: right; }
  .row .strip { grid-column: 1 / -1; height: 32px; }
  .row .actions { grid-column: 1 / -1; justify-content: flex-end; margin-top: -4px; }
  .cell { font-size: 9.5px; }
  .cell .dl { font-size: 7.5px; }
  .time { font-size: 26px; }
}
@media (prefers-reduced-motion: no-preference) { .marker { transition: left .2s ease; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Time Bridge</h1>
      <p class="sub">Compare clocks across time zones and find hours that work for everyone.</p>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Clock format">
        <button id="fmt12" type="button">12h</button>
        <button id="fmt24" type="button">24h</button>
      </div>
      <button class="btn" id="nowBtn" type="button">Back to now</button>
    </div>
  </header>

  <section class="scrub" aria-label="Pick a time">
    <div class="scrub-top">
      <span class="scrub-label">Shift time</span>
      <span class="scrub-value" id="scrubValue"></span>
    </div>
    <input type="range" id="scrub" min="-1440" max="1440" step="15" value="0" aria-label="Shift time by up to 24 hours either way">
    <div class="ticks"><span>−24h</span><span>−12h</span><span>now</span><span>+12h</span><span>+24h</span></div>
  </section>

  <div class="legend">
    <span><i class="sw" style="background:var(--day)"></i>Working hours 08–18</span>
    <span><i class="sw" style="background:var(--shoulder)"></i>Early / evening</span>
    <span><i class="sw" style="background:var(--night)"></i>Night 22–06</span>
    <span><i class="sw" style="background:var(--marker)"></i>Selected time · click any hour to jump</span>
  </div>

  <section class="zones" id="zones" aria-label="Time zones"></section>

  <form class="add" id="addForm" autocomplete="off">
    <input id="addInput" list="tzList" placeholder="Add a city or IANA zone, e.g. Nairobi or America/Denver" aria-label="City or time zone">
    <datalist id="tzList"></datalist>
    <button class="btn primary" type="submit">Add zone</button>
  </form>
  <p class="msg" id="msg" role="status"></p>

  <section class="summary" aria-label="Shareable summary">
    <div class="summary-top">
      <span class="scrub-label">Paste into an invite</span>
      <button class="btn" id="copyBtn" type="button">Copy</button>
    </div>
    <pre id="summaryText"></pre>
  </section>
</div>

<script>
(() => {
  const CITIES = {
    "San Francisco": "America/Los_Angeles", "Los Angeles": "America/Los_Angeles", "Seattle": "America/Los_Angeles",
    "Vancouver": "America/Vancouver", "Denver": "America/Denver", "Phoenix": "America/Phoenix", "Chicago": "America/Chicago",
    "Austin": "America/Chicago", "Mexico City": "America/Mexico_City", "New York": "America/New_York", "Toronto": "America/Toronto",
    "Boston": "America/New_York", "Miami": "America/New_York", "Bogotá": "America/Bogota", "Lima": "America/Lima",
    "Santiago": "America/Santiago", "São Paulo": "America/Sao_Paulo", "Buenos Aires": "America/Argentina/Buenos_Aires",
    "Honolulu": "Pacific/Honolulu", "Anchorage": "America/Anchorage", "Reykjavik": "Atlantic/Reykjavik",
    "London": "Europe/London", "Dublin": "Europe/Dublin", "Lisbon": "Europe/Lisbon", "Paris": "Europe/Paris",
    "Berlin": "Europe/Berlin", "Amsterdam": "Europe/Amsterdam", "Madrid": "Europe/Madrid", "Rome": "Europe/Rome",
    "Zurich": "Europe/Zurich", "Stockholm": "Europe/Stockholm", "Warsaw": "Europe/Warsaw", "Athens": "Europe/Athens",
    "Istanbul": "Europe/Istanbul", "Kyiv": "Europe/Kyiv", "Moscow": "Europe/Moscow", "Cairo": "Africa/Cairo",
    "Lagos": "Africa/Lagos", "Nairobi": "Africa/Nairobi", "Johannesburg": "Africa/Johannesburg", "Tel Aviv": "Asia/Jerusalem",
    "Riyadh": "Asia/Riyadh", "Dubai": "Asia/Dubai", "Tehran": "Asia/Tehran", "Karachi": "Asia/Karachi",
    "Mumbai": "Asia/Kolkata", "Delhi": "Asia/Kolkata", "Bengaluru": "Asia/Kolkata", "Kathmandu": "Asia/Kathmandu",
    "Dhaka": "Asia/Dhaka", "Bangkok": "Asia/Bangkok", "Jakarta": "Asia/Jakarta", "Ho Chi Minh City": "Asia/Ho_Chi_Minh",
    "Singapore": "Asia/Singapore", "Kuala Lumpur": "Asia/Kuala_Lumpur", "Manila": "Asia/Manila", "Hong Kong": "Asia/Hong_Kong",
    "Shanghai": "Asia/Shanghai", "Beijing": "Asia/Shanghai", "Taipei": "Asia/Taipei", "Seoul": "Asia/Seoul",
    "Tokyo": "Asia/Tokyo", "Perth": "Australia/Perth", "Adelaide": "Australia/Adelaide", "Brisbane": "Australia/Brisbane",
    "Sydney": "Australia/Sydney", "Melbourne": "Australia/Melbourne", "Auckland": "Pacific/Auckland", "UTC": "UTC"
  };

  const localTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch { return "UTC"; } })();
  const store = {
    get(k, d) { try { const v = localStorage.getItem("timebridge:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("timebridge:" + k, JSON.stringify(v)); } catch {} }
  };

  const defaults = [
    { label: "Your time", tz: localTz },
    { label: "San Francisco", tz: "America/Los_Angeles" },
    { label: "New York", tz: "America/New_York" },
    { label: "London", tz: "Europe/London" },
    { label: "Bengaluru", tz: "Asia/Kolkata" },
    { label: "Singapore", tz: "Asia/Singapore" },
    { label: "Tokyo", tz: "Asia/Tokyo" },
    { label: "Sydney", tz: "Australia/Sydney" }
  ].filter((z, i, a) => a.findIndex(o => o.tz === z.tz) === i);

  let zones = store.get("zones", null);
  if (!Array.isArray(zones) || !zones.length || !zones.every(z => z && validTz(z.tz))) zones = defaults;
  let h24 = store.get("h24", false);
  let shiftMin = 0;

  const fmtCache = {};
  function fmt(tz) {
    return fmtCache[tz] ||= new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short"
    });
  }
  function validTz(tz) { try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return true; } catch { return false; } }
  function parts(tz, t) {
    const o = {};
    for (const p of fmt(tz).formatToParts(t)) o[p.type] = p.value;
    return { y: +o.year, mo: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second, wd: o.weekday };
  }
  function offsetMin(tz, t) {
    const p = parts(tz, t);
    return Math.round((Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(t / 1000) * 1000) / 60000);
  }
  const dayNum = p => Date.UTC(p.y, p.mo - 1, p.d) / 86400000;
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const pad = n => String(n).padStart(2, "0");

  function fmtOffset(m) {
    if (m === 0) return "UTC±0";
    const s = m < 0 ? "−" : "+", a = Math.abs(m);
    return "UTC" + s + Math.floor(a / 60) + (a % 60 ? ":" + pad(a % 60) : "");
  }
  function fmtDelta(m) {
    if (m === 0) return "same as base";
    const s = m < 0 ? "−" : "+", a = Math.abs(m), h = Math.floor(a / 60), mm = a % 60;
    return s + (h ? h + "h" : "") + (mm ? (h ? " " : "") + mm + "m" : "") + " vs base";
  }
  function clock(p, withSec) {
    if (h24) return { main: pad(p.h) + ":" + pad(p.mi) + (withSec ? ":" + pad(p.s) : ""), suf: "" };
    const h = p.h % 12 || 12;
    return { main: h + ":" + pad(p.mi) + (withSec ? ":" + pad(p.s) : ""), suf: p.h < 12 ? "am" : "pm" };
  }
  const hourLabel = h => h24 ? pad(h) : (h % 12 || 12) + (h < 12 ? "a" : "p");
  const band = h => (h >= 8 && h < 18) ? "d" : (h >= 22 || h < 6) ? "n" : "s";
  const dayWord = diff => diff === 0 ? "" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : (diff > 0 ? "+" : "") + diff + " days";

  const $ = id => document.getElementById(id);
  const zonesEl = $("zones");

  function save() { store.set("zones", zones); }

  function build() {
    zonesEl.textContent = "";
    zones.forEach((z, i) => {
      const row = document.createElement("div");
      row.className = "row" + (i === 0 ? " home" : "");
      row.innerHTML = `
        <div class="place">
          <div class="city"><span class="name"></span>${i === 0 ? '<span class="pill">Base</span>' : ""}<span class="pill day" hidden></span></div>
          <div class="meta"><span class="tzid"></span> · <span class="off"></span></div>
          ${i === 0 ? "" : '<div class="delta"></div>'}
        </div>
        <div class="clock"><div class="time"></div><div class="date"></div></div>
        <div class="strip" role="group"></div>
        <div class="actions">
          ${i === 0 ? "" : '<button class="icon" data-act="home" type="button">Make base</button>'}
          ${i === 0 ? "" : '<button class="icon" data-act="up" type="button" aria-label="Move up">↑</button>'}
          <button class="icon" data-act="del" type="button" aria-label="Remove">✕</button>
        </div>`;
      row.querySelector(".name").textContent = z.label;
      row.querySelector(".tzid").textContent = z.tz;
      row.querySelector(".strip").setAttribute("aria-label", "Hours in " + z.label);
      const strip = row.querySelector(".strip");
      for (let c = 0; c < 24; c++) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "cell"; b.dataset.col = c;
        strip.appendChild(b);
      }
      const mk = document.createElement("div"); mk.className = "marker"; strip.appendChild(mk);
      row.addEventListener("click", e => {
        const btn = e.target.closest("button"); if (!btn) return;
        if (btn.classList.contains("cell")) { jumpToCol(+btn.dataset.col); return; }
        const act = btn.dataset.act;
        if (act === "del") { zones.splice(i, 1); if (!zones.length) zones = [{ label: "Your time", tz: localTz }]; }
        if (act === "up") { [zones[i - 1], zones[i]] = [zones[i], zones[i - 1]]; }
        if (act === "home") { zones.unshift(zones.splice(i, 1)[0]); }
        save(); build(); render();
      });
      zonesEl.appendChild(row);
    });
  }

  let lastStripKey = "";
  function selected() { return Date.now() + shiftMin * 60000; }
  function baseMidnight(t) {
    const p = parts(zones[0].tz, t);
    return Math.floor(t / 1000) * 1000 - ((p.h * 60 + p.mi) * 60 + p.s) * 1000;
  }
  function jumpToCol(col) {
    const t = selected();
    const target = baseMidnight(t) + col * 3600000;
    shiftMin = Math.round((target - Date.now()) / 60000 / 15) * 15;
    shiftMin = Math.max(-1440, Math.min(1440, shiftMin));
    $("scrub").value = shiftMin;
    render();
  }

  function render() {
    const t = selected();
    const base = zones[0];
    const bp = parts(base.tz, t);
    const bOff = offsetMin(base.tz, t);
    const mid = baseMidnight(t);
    const stripKey = mid + "|" + h24 + "|" + zones.map(z => z.tz).join(",");
    const rebuildStrips = stripKey !== lastStripKey;
    lastStripKey = stripKey;

    [...zonesEl.children].forEach((row, i) => {
      const z = zones[i];
      const p = parts(z.tz, t);
      const off = offsetMin(z.tz, t);
      const c = clock(p, shiftMin === 0);
      row.querySelector(".time").innerHTML = c.main + (c.suf ? `<small>${c.suf}</small>` : "");
      row.querySelector(".date").textContent = `${p.wd}, ${p.d} ${MONTHS[p.mo - 1]}`;
      row.querySelector(".off").textContent = fmtOffset(off);
      const dl = row.querySelector(".delta"); if (dl) dl.textContent = fmtDelta(off - bOff);
      const pill = row.querySelector(".pill.day");
      const dw = dayWord(dayNum(p) - dayNum(bp));
      pill.hidden = !dw; pill.textContent = dw;

      if (rebuildStrips) {
        row.querySelectorAll(".cell").forEach((cell, col) => {
          const ct = mid + col * 3600000;
          const cp = parts(z.tz, ct);
          cell.className = "cell " + band(cp.h) + (cp.h === 0 && cp.mi === 0 ? " mid" : "");
          const half = cp.mi ? `<span class="dl">:${pad(cp.mi)}</span>` : "";
          cell.innerHTML = cp.h === 0 ? `<span><span class="dl">${cp.wd}</span>${cp.d}</span>` : `<span>${hourLabel(cp.h)}${half}</span>`;
          cell.title = `${z.label}: ${cp.wd} ${cp.d} ${MONTHS[cp.mo - 1]}, ${clock(cp).main}${clock(cp).suf}`;
        });
      }
      const frac = ((t - mid) / 86400000) * 100;
      row.querySelector(".marker").style.left = Math.max(0, Math.min(100, frac)) + "%";
    });

    const bc = clock(bp);
    $("scrubValue").innerHTML = shiftMin === 0
      ? `Showing <b>live time</b>`
      : `Showing <b>${bc.main}${bc.suf} ${bp.wd} ${bp.d} ${MONTHS[bp.mo - 1]}</b> in ${esc(base.label)} · ${fmtDelta(shiftMin).replace(" vs base", "")} from now`;
    $("nowBtn").disabled = shiftMin === 0;

    $("summaryText").textContent = zones.map(z => {
      const p = parts(z.tz, t), c = clock(p);
      return `${z.label.padEnd(16)} ${(c.main + c.suf).padStart(7)}  ${p.wd} ${p.d} ${MONTHS[p.mo - 1]}  (${fmtOffset(offsetMin(z.tz, t))})`;
    }).join("\n");
  }
  function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }

  // Controls
  function setFmt(v) {
    h24 = v; store.set("h24", v);
    $("fmt12").setAttribute("aria-pressed", String(!v));
    $("fmt24").setAttribute("aria-pressed", String(v));
    render();
  }
  $("fmt12").onclick = () => setFmt(false);
  $("fmt24").onclick = () => setFmt(true);
  $("scrub").addEventListener("input", e => { shiftMin = +e.target.value; render(); });
  $("nowBtn").onclick = () => { shiftMin = 0; $("scrub").value = 0; render(); };

  // Add zone
  const allTz = (() => { try { return Intl.supportedValuesOf("timeZone"); } catch { return []; } })();
  const dl = $("tzList");
  const opts = Object.keys(CITIES).sort().map(c => c).concat(allTz);
  dl.innerHTML = opts.map(o => `<option value="${esc(o)}"></option>`).join("");
  function resolve(q) {
    q = q.trim(); if (!q) return null;
    const lc = q.toLowerCase();
    const city = Object.keys(CITIES).find(c => c.toLowerCase() === lc);
    if (city) return { label: city, tz: CITIES[city] };
    const tz = allTz.find(t => t.toLowerCase() === lc) || (validTz(q) ? q : null);
    if (tz) return { label: tz.split("/").pop().replace(/_/g, " "), tz };
    const partial = Object.keys(CITIES).find(c => c.toLowerCase().startsWith(lc))
      || allTz.find(t => t.toLowerCase().split("/").pop().replace(/_/g, " ").startsWith(lc));
    if (partial) return CITIES[partial] ? { label: partial, tz: CITIES[partial] } : { label: partial.split("/").pop().replace(/_/g, " "), tz: partial };
    return null;
  }
  const msg = $("msg");
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const r = resolve($("addInput").value);
    if (!r) { msg.className = "msg err"; msg.textContent = `No zone matches "${$("addInput").value}". Try a major city or an IANA name like Asia/Seoul.`; return; }
    if (zones.some(z => z.label === r.label && z.tz === r.tz)) { msg.className = "msg"; msg.textContent = `${r.label} is already on the list.`; return; }
    zones.push(r); save(); build(); render();
    msg.className = "msg"; msg.textContent = `Added ${r.label} (${r.tz}).`;
    $("addInput").value = "";
  });

  $("copyBtn").addEventListener("click", () => {
    const text = $("summaryText").textContent;
    const done = () => { $("copyBtn").textContent = "Copied"; setTimeout(() => $("copyBtn").textContent = "Copy", 1500); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents($("summaryText"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      msg.className = "msg"; msg.textContent = "Text selected. Press Ctrl+C or ⌘C to copy.";
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
  });

  build();
  setFmt(h24);
  setInterval(render, 1000);
})();
</script>
</body>
</html>
